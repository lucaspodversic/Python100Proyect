[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alertas-email"
version = "1.0.0"
description = "Vigila carpetas compartidas y avisa por email cuando un archivo crítico cambia."
requires-python = ">=3.10"
dependencies = []  # sólo biblioteca estándar (smtplib, hashlib, json)

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
alertas = "alertas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
