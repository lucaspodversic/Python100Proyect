[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-postulaciones"
version = "1.0.0"
description = "Bot genérico de postulación a ofertas (Page Object) que corre contra un sitio MOCK local."
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Sólo si querés manejar un navegador real contra el sitio mock.
selenium = ["selenium>=4.20"]

[project.scripts]
bot-postulaciones = "bot_postulaciones.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
