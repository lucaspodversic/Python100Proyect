[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "informes-pdf"
version = "1.0.0"
description = "Genera informes PDF con gráficos y tablas desde una base de datos, de forma programada."
requires-python = ">=3.10"
dependencies = ["fpdf2>=2.7", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "pypdf>=4"]

[project.scripts]
informes-pdf = "informes_pdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
