[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "limpiador-bandeja"
version = "1.0.0"
description = "Clasifica, archiva o envía a la papelera correos de Gmail según reglas personalizadas."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
gmail = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.1"]

[project.scripts]
limpiador-bandeja = "limpiador_correo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
