[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facturacion-automatica"
version = "1.0.0"
description = "Extrae datos de facturas PDF y los registra en un sistema contable."
requires-python = ">=3.10"
dependencies = ["pypdf>=4", "fpdf2>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
facturacion = "facturacion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
