[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recomendador-peliculas"
version = "1.0.0"
description = "Recomendador de películas por filtrado colaborativo (KNN de ítems y factorización matricial) con numpy."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
recomendador = "recomendador.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
