[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictor-entregas"
version = "1.0.0"
description = "Predicción del tiempo de entrega (delivery) con Gradient Boosting e intervalos por cuantiles."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
predictor-entregas = "entregas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
