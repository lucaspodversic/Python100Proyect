[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "series-ventas"
version = "1.0.0"
description = "Pronóstico de ventas mensuales con SARIMA (statsmodels), Holt-Winters y fallback estacional ingenuo."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "statsmodels>=0.14", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
series-ventas = "ventas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
