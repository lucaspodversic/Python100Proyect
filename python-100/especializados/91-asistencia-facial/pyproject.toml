# Configuración del proyecto (PEP 621). Instalación: pip install -e ".[dev]"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asistencia-facial"
version = "1.0.0"
description = "Control de asistencia por reconocimiento facial con pipeline intercambiable y embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
vision = ["opencv-python>=4.8", "face_recognition>=1.3"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["asistencia"]

[tool.pytest.ini_options]
# pythonpath permite importar el paquete sin instalarlo.
testpaths = ["tests"]
pythonpath = ["."]
# Sin caché de pytest para no ensuciar el repositorio.
addopts = "-q -p no:cacheprovider"
# Aviso de deprecación interno de Starlette sobre httpx (no afecta al código).
filterwarnings = ["ignore:Using `httpx`"]
