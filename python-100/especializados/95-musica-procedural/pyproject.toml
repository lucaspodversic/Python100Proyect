# Configuración del proyecto (PEP 621). Instalación: pip install -e ".[dev]"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musica-procedural"
version = "1.0.0"
description = "Generador de música procedural con reglas armónicas, síntesis a WAV, exportación MIDI y reproducción con pygame"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
audio = ["pygame>=2.5"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["musica"]

[tool.pytest.ini_options]
# pythonpath permite importar el paquete sin instalarlo.
testpaths = ["tests"]
pythonpath = ["."]
# Sin caché de pytest para no ensuciar el repositorio.
addopts = "-q -p no:cacheprovider"
# Aviso de deprecación interno de Starlette sobre httpx (no afecta al código).
filterwarnings = ["ignore:Using `httpx`"]
