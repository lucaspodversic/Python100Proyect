# Configuración del proyecto (PEP 621). Instalación: pip install -e ".[dev]"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detector-yolo"
version = "1.0.0"
description = "Detector de objetos con interfaz intercambiable (YOLO/ultralytics o falso), NMS, anotación y seguimiento"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pillow>=10"]

[project.optional-dependencies]
yolo = ["ultralytics>=8.2"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["detector"]

[tool.pytest.ini_options]
# pythonpath permite importar el paquete sin instalarlo.
testpaths = ["tests"]
pythonpath = ["."]
# Sin caché de pytest para no ensuciar el repositorio.
addopts = "-q -p no:cacheprovider"
# Aviso de deprecación interno de Starlette sobre httpx (no afecta al código).
filterwarnings = ["ignore:Using `httpx`"]
