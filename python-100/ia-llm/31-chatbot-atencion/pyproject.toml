# Proyecto 31-chatbot-atencion: Chatbot de atención al cliente con FAQ y LLM intercambiable
[project]
name = "chatbot-atencion"
version = "1.0.0"
description = "Chatbot de atención al cliente con FAQ y LLM intercambiable"
requires-python = ">=3.10"
# httpx se usa para hablar con las APIs de LLM (OpenAI / Anthropic)
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -q"
filterwarnings = ["ignore:Using `httpx`"]
