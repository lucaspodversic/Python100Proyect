# Proyecto 32-rag-documentos: RAG sobre documentos propios con embeddings locales y citas
[project]
name = "rag-documentos"
version = "1.0.0"
description = "RAG sobre documentos propios con embeddings locales y citas"
requires-python = ">=3.10"
# httpx se usa para hablar con las APIs de LLM (OpenAI / Anthropic)
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Opcional: soporte de PDF
pdf = ["pypdf>=4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -q"
filterwarnings = ["ignore:Using `httpx`"]
