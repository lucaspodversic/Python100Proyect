# Proyecto 33-notas-reuniones: Notas de reuniones: transcripción (Whisper) + resumen, decisiones y tareas
[project]
name = "notas-reuniones"
version = "1.0.0"
description = "Notas de reuniones: transcripción (Whisper) + resumen, decisiones y tareas"
requires-python = ">=3.10"
# httpx se usa para hablar con las APIs de LLM (OpenAI / Anthropic)
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Opcional: Whisper local (descarga modelos, pesado)
local = ["openai-whisper"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -q"
filterwarnings = ["ignore:Using `httpx`"]
