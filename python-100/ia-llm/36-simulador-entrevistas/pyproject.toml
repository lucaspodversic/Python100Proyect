# Proyecto 36-simulador-entrevistas: Simulador de entrevistas laborales con evaluación por LLM
[project]
name = "simulador-entrevistas"
version = "1.0.0"
description = "Simulador de entrevistas laborales con evaluación por LLM"
requires-python = ">=3.10"
# httpx se usa para hablar con las APIs de LLM (OpenAI / Anthropic)
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -q"
filterwarnings = ["ignore:Using `httpx`"]
