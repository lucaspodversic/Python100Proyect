# Proyecto 37-gateway-llm: Gateway unificado de LLMs: ruteo, fallback, reintentos, caché y cuotas
[project]
name = "gateway-llm"
version = "1.0.0"
description = "Gateway unificado de LLMs: ruteo, fallback, reintentos, caché y cuotas"
requires-python = ">=3.10"
# httpx se usa para hablar con las APIs de LLM (OpenAI / Anthropic)
dependencies = ["httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -q"
filterwarnings = ["ignore:Using `httpx`"]
