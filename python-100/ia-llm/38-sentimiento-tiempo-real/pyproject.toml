# Proyecto 38-sentimiento-tiempo-real: Monitor de sentimiento en redes casi en tiempo real con alertas
[project]
name = "sentimiento-tiempo-real"
version = "1.0.0"
description = "Monitor de sentimiento en redes casi en tiempo real con alertas"
requires-python = ">=3.10"
# httpx se usa para hablar con las APIs de LLM (OpenAI / Anthropic)
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -q"
filterwarnings = ["ignore:Using `httpx`"]
