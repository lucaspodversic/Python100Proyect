# Proyecto 39-clasificador-tickets: Clasificador de tickets de soporte con etiquetas restringidas y métricas
[project]
name = "clasificador-tickets"
version = "1.0.0"
description = "Clasificador de tickets de soporte con etiquetas restringidas y métricas"
requires-python = ">=3.10"
# httpx se usa para hablar con las APIs de LLM (OpenAI / Anthropic)
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -q"
filterwarnings = ["ignore:Using `httpx`"]
