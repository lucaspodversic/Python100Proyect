# Configuración del proyecto (PEP 621). Instalación: pip install -e ".[dev]"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesa-ayuda"
version = "1.0.0"
description = "Mesa de ayuda (tickets) con máquina de estados, SLA, asignación balanceada y notas internas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["fastapi>=0.110", "sqlalchemy>=2.0", "pydantic>=2.5", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
# pythonpath permite importar el paquete sin instalarlo.
testpaths = ["tests"]
pythonpath = ["."]
# Sin caché de pytest para no ensuciar el repositorio.
addopts = "-q -p no:cacheprovider"
# Aviso de deprecación interno de Starlette sobre httpx (no afecta al código).
filterwarnings = ["ignore:Using `httpx`"]
