# Configuración del proyecto (PEP 621). Instalar con: pip install -e ".[dev]"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiolibro"
version = "1.0.0"
description = "Convierte PDFs en audiolibros MP3 con gTTS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Dependencias de ejecución (se mantienen al mínimo para que sea liviano)
dependencies = ["pypdf>=4"]

[project.optional-dependencies]
# Dependencias sólo para desarrollo / tests
dev = ["pytest>=7"]
# Motor de voz real (requiere internet al convertir)
tts = ["gTTS>=2.5"]

[tool.setuptools]
packages = ["audiolibro"]

[tool.pytest.ini_options]
# Permite importar el paquete sin instalarlo y evita crear .pytest_cache
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
