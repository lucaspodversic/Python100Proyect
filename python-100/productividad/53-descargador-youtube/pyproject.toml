# Configuración del proyecto (PEP 621). Instalar con: pip install -e ".[dev]"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "descargador"
version = "1.0.0"
description = "Descargador de videos de YouTube (yt-dlp) con selección de calidad"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Dependencias de ejecución (se mantienen al mínimo para que sea liviano)
dependencies = []

[project.optional-dependencies]
# Dependencias sólo para desarrollo / tests
dev = ["pytest>=7"]
# Backend real de descarga (pytube suele estar roto; yt-dlp se mantiene activo)
ytdlp = ["yt-dlp>=2024.1.0"]

[tool.setuptools]
packages = ["descargador"]

[tool.pytest.ini_options]
# Permite importar el paquete sin instalarlo y evita crear .pytest_cache
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
