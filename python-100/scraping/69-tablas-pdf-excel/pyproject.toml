# Configuración del proyecto (PEP 621). Instalar con: pip install -e ".[dev]"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdftablas"
version = "1.0.0"
description = "Extractor de tablas de PDF a Excel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Dependencias de ejecución (se mantienen al mínimo para que sea liviano)
dependencies = ["pdfplumber>=0.10", "openpyxl>=3.1"]

[project.optional-dependencies]
# Dependencias sólo para desarrollo / tests
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["pdftablas"]

[tool.pytest.ini_options]
# Permite importar el paquete sin instalarlo y evita crear .pytest_cache
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
