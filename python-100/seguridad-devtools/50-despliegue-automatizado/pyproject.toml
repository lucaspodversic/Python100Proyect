# Configuración del proyecto (PEP 621). Instalar con: pip install -e ".[dev]"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desplegador"
version = "1.0.0"
description = "Despliegue automatizado a VPS con Git + SSH (releases atómicos y rollback)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Dependencias de ejecución (se mantienen al mínimo para que sea liviano)
dependencies = []

[project.optional-dependencies]
# Dependencias sólo para desarrollo / tests
dev = ["pytest>=7"]
# Conexión SSH real (opcional: los tests usan un fake)
ssh = ["paramiko>=3"]

[tool.setuptools]
packages = ["desplegador"]

[tool.pytest.ini_options]
# Permite importar el paquete sin instalarlo y evita crear .pytest_cache
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
