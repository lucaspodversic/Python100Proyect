# Proyecto 25: Acortador de URLs con estadísticas de clics.
[project]
name = "acortador-urls"
version = "1.0.0"
description = "Servicio acortador de URLs con FastAPI, redirección y estadísticas"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -q"
filterwarnings = ["ignore:Using `httpx`"]
