# Proyecto 28: Portafolio web personal dinámico (Flask + SQLite).
[project]
name = "portafolio-dinamico"
version = "1.0.0"
description = "Portafolio full-stack: proyectos desde base de datos, panel admin y contacto"
requires-python = ">=3.10"
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -q"
